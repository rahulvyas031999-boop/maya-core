<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA // SOVEREIGN OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #9d4edd;
            --red: #ff0055;
            --dark: #030612;
            --glass: rgba(6, 12, 28, 0.90);
            --border: rgba(0, 243, 255, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #0a1128 0%, var(--dark) 100%);
            color: #d1e8ff;
            font-family: 'Rajdhani', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--cyan);
        }
        .hud-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .hud-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }
        #mainStage {
            flex: 1;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #coreContainer {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ring { position: absolute; border-radius: 50%; pointer-events: none; }
        .ring-1 {
            width: 170px; height: 170px;
            border-top: 2px solid var(--cyan);
            border-bottom: 2px solid var(--purple);
            animation: spinCW 12s linear infinite;
        }
        .ring-2 {
            width: 140px; height: 140px;
            border-left: 2px solid var(--cyan);
            animation: spinCCW 8s linear infinite;
        }
        .quantum-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, var(--cyan) 45%, var(--purple) 85%);
            box-shadow: 0 0 35px var(--cyan), inset 0 0 15px #fff;
            transition: transform 0.15s ease;
        }
        .quantum-orb.speaking {
            animation: voicePulse 0.9s infinite alternate ease-in-out;
            box-shadow: 0 0 60px var(--cyan), 0 0 90px var(--purple);
        }
        .quantum-orb.listening {
            transform: scale(1.15);
            box-shadow: 0 0 60px #00ffcc;
        }
        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
        @keyframes voicePulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.2); filter: brightness(1.3); }
        }
        #actionCard {
            position: absolute;
            z-index: 15;
            width: 90%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #actionCard img {
            width: 100%;
            border-radius: 8px;
            max-height: 200px;
            object-fit: cover;
        }
        .action-btns { display: flex; gap: 8px; width: 100%; }
        .holo-btn {
            flex: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            background: rgba(0, 243, 255, 0.15);
            color: var(--cyan);
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--cyan);
            cursor: pointer;
        }
        .close-btn { background: rgba(255, 0, 85, 0.15); color: var(--red); border-color: var(--red); }
        #controls {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #statusLabel {
            font-size: 0.88rem;
            color: #d1e8ff;
            font-weight: 600;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-row { display: flex; align-items: center; gap: 16px; }
        .round-btn {
            width: 58px; height: 58px;
            border-radius: 50%;
            border: 2px solid #00ffcc;
            background: radial-gradient(circle at 35% 35%, #00ffcc, #008877);
            color: #030611;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .round-btn.active {
            background: radial-gradient(circle at 35% 35%, #ff3366, var(--red));
            border-color: var(--red);
        }
        .stop-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid var(--red);
            background: rgba(255, 0, 85, 0.2);
            color: var(--red);
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #debugBadge {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 6px;
            line-height: 1.4;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="debugBadge">mic: OFF <br> sent: 0</div>

    <header>
        <div class="hud-title">MAYA <span style="color:var(--cyan); font-size:0.7rem;">SOVEREIGN OS</span></div>
        <div class="hud-badge">
            <div class="hud-dot"></div>
            <span id="connectionState">OFFLINE</span>
        </div>
    </header>

    <div id="mainStage">
        <div id="coreContainer">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div id="orb" class="quantum-orb"></div>
        </div>

        <div id="actionCard">
            <img id="cardImage" src="" alt="Projection" />
            <div class="action-btns">
                <a id="downloadBtn" href="" target="_blank" class="holo-btn">⬇️ DOWNLOAD</a>
                <button onclick="closeActionCard()" class="holo-btn close-btn">❌ HATAO</button>
            </div>
        </div>
    </div>

    <div id="controls">
        <div id="statusLabel">कॉल शुरू करने के लिए टैप करें</div>
        <div class="btn-row">
            <button id="callToggle" class="round-btn" onclick="toggleCall()">📞</button>
            <button class="stop-btn" onclick="interruptPlayback()" title="रोकें">⏹</button>
        </div>
    </div>

    <script>
        let ws = null;
        let isCalling = false;
        let isMayaSpeaking = false;
        let activeAudio = null;
        let mediaStream = null;
        let mediaRecorder = null;
        let packetsSent = 0;
        let userInitiatedStop = false;

        let heartbeatInterval = null;
        let audioQueue = [];
        let isPlayingQueue = false;

        const orb = document.getElementById("orb");
        const statusLabel = document.getElementById("statusLabel");
        const actionCard = document.getElementById("actionCard");
        const cardImage = document.getElementById("cardImage");
        const downloadBtn = document.getElementById("downloadBtn");
        const connectionState = document.getElementById("connectionState");
        const debugBadge = document.getElementById("debugBadge");

        function setStatus(text) { statusLabel.innerText = text; }
        function setConnection(text) { connectionState.innerText = text; }

        async function toggleCall() {
            if (!isCalling) {
                await startLiveCall();
            } else {
                stopLiveCall();
            }
        }

        async function startLiveCall() {
            try {
                userInitiatedStop = false;
                packetsSent = 0;
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/live`);

                ws.onopen = async () => {
                    isCalling = true;
                    setConnection("ONLINE");
                    document.getElementById("callToggle").classList.add("active");
                    document.getElementById("callToggle").innerText = "🛑";
                    setStatus("लाइव कनेक्शन तैयार // बोलिए Boss...");
                    await initHardwareAudio();
                    startHeartbeat();
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "audio_chunk" || msg.type === "audio") {
                            enqueueAudioChunk(msg.data);
                        } else if (msg.type === "transcript") {
                            setStatus(`Boss: "${msg.text}"`);
                        } else if (msg.type === "reply_text") {
                            setStatus(`Maya: "${msg.text}"`);
                        } else if (msg.type === "image") {
                            showActionImage(msg.url);
                        } else if (msg.type === "task_complete") {
                            setStatus("Maya: background task complete.");
                        }
                    } catch (error) {
                        console.error("Message parse error:", error);
                    }
                };

                ws.onclose = () => { if (!userInitiatedStop) stopLiveCall(); };
                ws.onerror = () => { setStatus("WebSocket connection error"); };
            } catch (error) {
                console.error(error);
                stopLiveCall();
            }
        }

        function startHeartbeat() {
            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ping", ts: Date.now() }));
                }
            }, 15000);
        }

        function getSupportedMime() {
            const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
            for (let t of types) {
                if (MediaRecorder.isTypeSupported(t)) return t;
            }
            return "";
        }

        async function initHardwareAudio() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                const mimeType = getSupportedMime();
                mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);

                mediaRecorder.ondataavailable = (event) => {
                    // 4000 बाइट्स नॉइज़ गेट: कम आवाज़/सन्नाटे वाले पैकेट ड्रॉप होंगे
                    if (event.data && event.data.size > 4000 && !isMayaSpeaking && ws && ws.readyState === WebSocket.OPEN) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const b64 = reader.result.split(",")[1];
                            ws.send(JSON.stringify({
                                type: "audio_blob",
                                mime: mediaRecorder.mimeType || mimeType || "audio/webm",
                                data: b64
                            }));
                            packetsSent++;
                            debugBadge.innerHTML = `mic: ACTIVE <br> sent: ${packetsSent}`;
                        };
                        reader.readAsDataURL(event.data);
                    }
                };

                // Continuous recording slices of 2.5 seconds
                mediaRecorder.start(2500);
                debugBadge.innerHTML = `mic: ACTIVE <br> sent: 0`;

            } catch (err) {
                console.error("Mic error:", err);
                debugBadge.innerHTML = `mic: ERROR <br> ${err.message}`;
                setStatus("माइक चालू नहीं हो सका।");
            }
        }

        function enqueueAudioChunk(base64Data) {
            audioQueue.push(base64Data);
            if (!isPlayingQueue) {
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!audioQueue.length) {
                isPlayingQueue = false;
                isMayaSpeaking = false;
                orb.className = "quantum-orb";
                activeAudio = null;
                // Unmute mic tracks when Maya finishes speaking
                if (mediaStream) {
                    mediaStream.getAudioTracks().forEach(t => t.enabled = true);
                }
                return;
            }

            isPlayingQueue = true;
            isMayaSpeaking = true;
            orb.className = "quantum-orb speaking";

            // Mute mic input instead of stopping the recorder (avoids Android MediaRecorder crash)
            if (mediaStream) {
                mediaStream.getAudioTracks().forEach(t => t.enabled = false);
            }

            const nextChunk = audioQueue.shift();
            activeAudio = new Audio("data:audio/mp3;base64," + nextChunk);

            activeAudio.onended = () => { playNextInQueue(); };
            activeAudio.onerror = () => { playNextInQueue(); };
            activeAudio.play().catch(() => { playNextInQueue(); });
        }

        function interruptPlayback() {
            audioQueue = [];
            isPlayingQueue = false;
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
                activeAudio = null;
            }
            isMayaSpeaking = false;
            orb.className = "quantum-orb";
            if (mediaStream) {
                mediaStream.getAudioTracks().forEach(t => t.enabled = true);
            }
        }

        function showActionImage(url) {
            actionCard.style.display = "flex";
            cardImage.src = url;
            downloadBtn.href = url;
        }

        function closeActionCard() {
            actionCard.style.display = "none";
            cardImage.src = "";
            downloadBtn.href = "";
        }

        function stopLiveCall() {
            userInitiatedStop = true;
            interruptPlayback();
            isCalling = false;
            setConnection("OFFLINE");
            document.getElementById("callToggle").classList.remove("active");
            document.getElementById("callToggle").innerText = "📞";
            setStatus("कॉल समाप्त // पुनः बात करने के लिए टैप करें");
            orb.className = "quantum-orb";
            debugBadge.innerHTML = `mic: OFF <br> sent: 0`;

            closeActionCard();
            clearInterval(heartbeatInterval);

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                try { mediaRecorder.stop(); } catch (_) {}
            }
            mediaRecorder = null;

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            ws = null;
        }
    </script>
</body>
    </html>
