<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA // SOVEREIGN OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #9d4edd;
            --red: #ff0055;
            --dark: #030612;
            --glass: rgba(6, 12, 28, 0.90);
            --border: rgba(0, 243, 255, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #0a1128 0%, var(--dark) 100%);
            color: #d1e8ff;
            font-family: 'Rajdhani', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
     
        }
        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 105px;
        }
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--cyan);
        }
        .hud-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .hud-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
            transition: background 0.3s, box-shadow 0.3s;
        }
        #mainStage {
            flex: 1;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #coreContainer {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ring { position: absolute; border-radius: 50%; pointer-events: none; }
        .ring-1 {
            width: 170px; height: 170px;
            border-top: 2px solid var(--cyan);
            border-bottom: 2px solid var(--purple);
            animation: spinCW 12s linear infinite;
        }
        .ring-2 {
            width: 140px; height: 140px;
            border-left: 2px solid var(--cyan);
            animation: spinCCW 8s linear infinite;
        }
        .quantum-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, var(--cyan) 45%, var(--purple) 85%);
            box-shadow: 0 0 35px var(--cyan), inset 0 0 15px #fff;
            transition: transform 0.15s ease;
        }
        .quantum-orb.speaking {
            animation: voicePulse 0.9s infinite alternate ease-in-out;
            box-shadow: 0 0 60px var(--cyan), 0 0 90px var(--purple);
        }
        .quantum-orb.listening {
            transform: scale(1.15);
            box-shadow: 0 0 60px #00ffcc;
        }
        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
        @keyframes voicePulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.2); filter: brightness(1.3); }
        }
        #actionCard {
            position: absolute;
            z-index: 15;
            width: 90%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #actionCard img {
            width: 100%;
            border-radius: 8px;
            max-height: 200px;
            object-fit: cover;
        }
        .action-btns { display: flex; gap: 8px; width: 100%; }
        .holo-btn {
            flex: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            background: rgba(0, 243, 255, 0.15);
            color: var(--cyan);
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--cyan);
            cursor: pointer;
        }
        .close-btn { background: rgba(255, 0, 85, 0.15); color: var(--red); border-color: var(--red); }
        #telegramFallback {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            border: 1px solid rgba(255, 200, 0, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        #telegramFallback p {
            font-size: 0.8rem;
            color: #ffd166;
            text-align: center;
            font-weight: 600;
        }
        .fallback-btns { display: flex; gap: 8px; width: 100%; }
        .telegram-btn {
            background: rgba(255, 209, 102, 0.15);
            color: #ffd166;
            border-color: #ffd166;
        }
        #controls {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #statusLabel {
            font-size: 0.88rem;
            color: #d1e8ff;
            font-weight: 600;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-row { display: flex; align-items: center; gap: 16px; }
        .round-btn {
            width: 58px; height: 58px;
            border-radius: 50%;
            border: 2px solid #00ffcc;
            background: radial-gradient(circle at 35% 35%, #00ffcc, #008877);
            color: #030611;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .round-btn.active {
            background: radial-gradient(circle at 35% 35%, #ff3366, var(--red));
            border-color: var(--red);
        }
        .stop-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid var(--red);
            background: rgba(255, 0, 85, 0.2);
            color: var(--red);
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #diagnosticHUD {
            position: fixed;
            top: 6px;
            left: 8px;
            right: 8px;
            max-width: 460px;
            margin: 0 auto;
            z-index: 9999;
            background: rgba(3, 6, 18, 0.96);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 8px 12px;
            border-radius: 8px;
            line-height: 1.5;
            pointer-events: none;
        }
        .hud-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 2px 0; }
        .hud-warn { color: #ffd166; font-weight: bold; }
        .hud-err { color: #ff0055; font-weight: bold; }
        .hud-good { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div id="diagnosticHUD">
        <div class="hud-row"><span>AUDIO TELEMETRY</span><span id="d_ws" class="hud-err">WS: DISCONNECTED</span></div>
        <div class="hud-row"><span>MIC HARDWARE:</span><span id="d_mic">TRACK: OFF</span></div>
        <div class="hud-row"><span>LIVE ENERGY:</span><span id="d_vol">Vol: 0 (Threshold: 14)</span></div>
        <div class="hud-row"><span>VAD STATE:</span><span id="d_vad">Maya: IDLE | UserRec: false</span></div>
        <div class="hud-row"><span>DATA PIPE:</span><span id="d_delivery">Size: 0B | Sent: 0</span></div>
    </div>

    <header>
        <div class="hud-title">MAYA <span style="color:var(--cyan); font-size:0.7rem;">SOVEREIGN OS</span></div>
        <div class="hud-badge">
            <div class="hud-dot"></div>
            <span id="connectionState">OFFLINE</span>
        </div>
    </header>

    <div id="mainStage">
        <div id="coreContainer">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div id="orb" class="quantum-orb"></div>
        </div>
        <div id="actionCard">
            <img id="cardImage" src="" alt="Projection" />
            <div class="action-btns">
                <a id="downloadBtn" href="" target="_blank" class="holo-btn">⬇️ DOWNLOAD</a>
                <button onclick="closeActionCard()" class="holo-btn close-btn">❌ HATAO</button>
            </div>
        </div>
    </div>

    <div id="telegramFallback">
        <p>⚠️ नेटवर्क धीमा है। Telegram पर जारी रखें?</p>
        <div class="fallback-btns">
            <a id="telegramLinkBtn" href="#" target="_blank" class="holo-btn telegram-btn">💬 TELEGRAM MODE</a>
            <button onclick="dismissTelegramFallback()" class="holo-btn close-btn">❌ रहने दो</button>
        </div>
    </div>

    <div id="controls">
        <div id="statusLabel">कॉल शुरू करने के लिए टैप करें</div>
        <div class="btn-row">
            <button id="callToggle" class="round-btn" onclick="toggleCall()">📞</button>
            <button class="stop-btn" onclick="interruptPlayback()" title="रोकें">⏹</button>
        </div>
    </div>

    <script>
        let ws = null;
        let isCalling = false;
        let isMayaSpeaking = false;
        let mayaSpeakingWatchdog = null;
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let packetsSent = 0;
        let userInitiatedStop = false;

        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        let audioCtx = null;
        let analyser = null;
        let micSource = null;
        let animFrameId = null;
        let isUserSpeaking = false;
        let silenceTimer = null;

        let heartbeatInterval = null;
        let heartbeatTimeout = null;
        let lastPingSentAt = 0;

        let audioQueue = [];
        let isPlayingQueue = false;
        let activeSourceNode = null;

        let telegramLink = null;
        let weakNetworkTimer = null;
        let fallbackDismissedThisSpell = false;
        const WEAK_NETWORK_FALLBACK_DELAY = 6000;

        const orb = document.getElementById("orb");
        const statusLabel = document.getElementById("statusLabel");
        const actionCard = document.getElementById("actionCard");
        const cardImage = document.getElementById("cardImage");
        const downloadBtn = document.getElementById("downloadBtn");
        const connectionState = document.getElementById("connectionState");
        const telegramFallback = document.getElementById("telegramFallback");
        const telegramLinkBtn = document.getElementById("telegramLinkBtn");
        const hudDot = document.querySelector(".hud-dot");

        const d_ws = document.getElementById("d_ws");
        const d_mic = document.getElementById("d_mic");
        const d_vol = document.getElementById("d_vol");
        const d_vad = document.getElementById("d_vad");
        const d_delivery = document.getElementById("d_delivery");

        fetch("/telegram-link").then(r => r.json()).then(d => { telegramLink = d.url; }).catch(() => {});

        function maybeShowTelegramFallback() {
            if (!telegramLink || fallbackDismissedThisSpell) return;
            telegramLinkBtn.href = telegramLink;
            telegramFallback.style.display = "flex";
        }
        function dismissTelegramFallback() {
            fallbackDismissedThisSpell = true;
            telegramFallback.style.display = "none";
        }
        function hideTelegramFallback() { telegramFallback.style.display = "none"; }

        const CONNECTION_COLORS = { "ONLINE": "#00f3ff", "WEAK SIGNAL": "#ffd166", "RECONNECTING": "#ff9f1c", "OFFLINE": "#5a6472" };
        function setStatus(text) { statusLabel.innerText = text; }
        function setConnection(text) {
            connectionState.innerText = text;
            const color = CONNECTION_COLORS[text] || CONNECTION_COLORS.ONLINE;
            hudDot.style.background = color;
            hudDot.style.boxShadow = `0 0 8px ${color}`;
            if (text === "WEAK SIGNAL" || text === "RECONNECTING") {
                if (!weakNetworkTimer) weakNetworkTimer = setTimeout(maybeShowTelegramFallback, WEAK_NETWORK_FALLBACK_DELAY);
            } else {
                clearTimeout(weakNetworkTimer);
                weakNetworkTimer = null;
                if (text === "ONLINE" || text === "OFFLINE") { fallbackDismissedThisSpell = false; hideTelegramFallback(); }
            }
        }
        setConnection("OFFLINE");

        function getReconnectDelay(attempt) { return Math.min(1000 * Math.pow(2, attempt), 15000); }

        async function toggleCall() {
            if (!isCalling) {
                await startLiveCall();
            } else {
                stopLiveCall();
            }
        }
             async function startLiveCall() {
            try {
                userInitiatedStop = false;
                packetsSent = 0;
                d_ws.className = "hud-warn";
                d_ws.innerText = "WS: CONNECTING...";

                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/live`);

                ws.onopen = async () => {
                    isCalling = true;
                    reconnectAttempts = 0;
                    setConnection("ONLINE");
                    d_ws.className = "hud-good";
                    d_ws.innerText = "WS: LIVE (200 OK)";
                    document.getElementById("callToggle").classList.add("active");
                    document.getElementById("callToggle").innerText = "🛑";
                    setStatus("लाइव कनेक्शन तैयार // बोलिए Boss...");
                    startHeartbeat();
                    await initHardwareAudio();
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "audio_chunk" || msg.type === "audio") {
                            enqueueAudioChunk(msg.data);
                        } else if (msg.type === "transcript") {
                            setStatus(`Boss: "${msg.text}"`);
                        } else if (msg.type === "reply_text") {
                            setStatus(`Maya: "${msg.text}"`);
                        } else if (msg.type === "image") {
                            showActionImage(msg.url);
                        } else if (msg.type === "pong") {
                            clearTimeout(heartbeatTimeout);
                        }
                    } catch (error) { console.error("Parse error:", error); }
                };

                ws.onclose = () => {
                    stopHeartbeat();
                    d_ws.className = "hud-err";
                    d_ws.innerText = "WS: CLOSED";
                    if (!userInitiatedStop && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        setConnection("RECONNECTING");
                        setTimeout(() => { if (!userInitiatedStop) startLiveCall(); }, getReconnectDelay(reconnectAttempts));
                    } else {
                        stopLiveCall();
                    }
                };
                ws.onerror = () => { setStatus("कनेक्शन एरर"); };
            } catch (error) {
                console.error(error);
                stopLiveCall();
            }
        }

        function startHeartbeat() {
            stopHeartbeat();
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    lastPingSentAt = Date.now();
                    ws.send(JSON.stringify({ type: "ping", ts: lastPingSentAt }));
                    clearTimeout(heartbeatTimeout);
                    heartbeatTimeout = setTimeout(() => { setConnection("WEAK SIGNAL"); }, 8000);
                }
            }, 15000);
        }

        function stopHeartbeat() {
            clearInterval(heartbeatInterval);
            clearTimeout(heartbeatTimeout);
        }

        async function initHardwareAudio() {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: true
                    }
                });

                const track = mediaStream.getAudioTracks()[0];
                d_mic.className = "hud-good";
                d_mic.innerText = `READY | Live: ${track.readyState}`;

                track.onmute = () => {
                    d_mic.className = "hud-err";
                    d_mic.innerText = "ALERT: MIC MUTED BY OS!";
                };
                track.onunmute = () => {
                    d_mic.className = "hud-good";
                    d_mic.innerText = "TRACK: ACTIVE";
                };

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                micSource = audioCtx.createMediaStreamSource(mediaStream);
                micSource.connect(analyser);

                function startFreshRecorder() {
                    recordedChunks = [];
                    try {
                        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm;codecs=opus" });
                    } catch (e) {
                        mediaRecorder = new MediaRecorder(mediaStream);
                    }

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            recordedChunks.push(e.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        if (recordedChunks.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
                            const completeBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
                            const blobSize = completeBlob.size;
                            recordedChunks = [];

                            // Calibrated threshold: 800 bytes captures even short words safely
                            if (blobSize > 800) {
                                const reader = new FileReader();
                                reader.onloadend = () => {
                                    const b64 = reader.result.split(",")[1];
                                    ws.send(JSON.stringify({ type: "audio_blob", mime: completeBlob.type, data: b64 }));
                                    packetsSent++;
                                    d_delivery.className = "hud-good";
                                    d_delivery.innerText = `DELIVERED: ${blobSize}B | Sent: ${packetsSent}`;
                                };
                                reader.readAsDataURL(completeBlob);
                            } else {
                                d_delivery.className = "hud-warn";
                                d_delivery.innerText = `REJECTED: ${blobSize}B < 800B`;
                            }
                        } else {
                            d_delivery.className = "hud-err";
                            d_delivery.innerText = "FAIL: ZERO_BYTES_CAPTURED";
                            recordedChunks = [];
                        }
                    };

                    mediaRecorder.start(250);
                }

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function monitorVAD() {
                    if (!isCalling) return;
                    analyser.getByteFrequencyData(dataArray);

                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let currentVol = Math.round(sum / dataArray.length);

                    if (currentVol > 14) {
                        d_vol.className = "hud-good";
                        d_vol.innerText = `Vol: ${currentVol} (Speaking DETECTED)`;
                    } else {
                        d_vol.className = "";
                        d_vol.innerText = `Vol: ${currentVol} (Threshold: 14)`;
                    }

                    if (currentVol > 14 && !isMayaSpeaking) {
                        if (!isUserSpeaking) {
                            isUserSpeaking = true;
                            orb.className = "quantum-orb listening";
                            startFreshRecorder();
                        }
                        clearTimeout(silenceTimer);
                    } else if (isUserSpeaking) {
                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(() => {
                            if (isUserSpeaking) {
                                isUserSpeaking = false;
                                orb.className = "quantum-orb";
                                if (mediaRecorder && mediaRecorder.state === "recording") {
                                    try {
                                        mediaRecorder.stop();
                                    } catch (e) {
                                        console.error("[RECORDER STOP ERROR]", e);
                                    }
                                }
                            }
                        }, 750);
                    }

                    d_vad.innerText = `Maya: ${isMayaSpeaking ? "SPEAKING" : "IDLE"} | UserRec: ${isUserSpeaking}`;
                    animFrameId = requestAnimationFrame(monitorVAD);
                }

                monitorVAD();
            } catch (err) {
                console.error("Mic init error:", err);
                d_mic.className = "hud-err";
                d_mic.innerText = `FAIL: ${err.name}`;
            }
        }

        function enqueueAudioChunk(base64Data) {
            audioQueue.push(base64Data);
            if (!isPlayingQueue) playNextInQueue();
        }

        async function playNextInQueue() {
            if (!audioQueue.length) {
                isPlayingQueue = false;
                isMayaSpeaking = false;
                clearTimeout(mayaSpeakingWatchdog);
                orb.className = "quantum-orb";
                activeSourceNode = null;
                return;
            }

            isPlayingQueue = true;
            isMayaSpeaking = true;
            orb.className = "quantum-orb speaking";

            // Safety Deadlock Watchdog: force-resets isMayaSpeaking if audio hangs
            clearTimeout(mayaSpeakingWatchdog);
            mayaSpeakingWatchdog = setTimeout(() => {
                if (isMayaSpeaking) {
                    console.warn("[AUDIO WATCHDOG] Audio playback timed out. Forcing Maya to IDLE.");
                    isMayaSpeaking = false;
                    isPlayingQueue = false;
                    orb.className = "quantum-orb";
                }
            }, 8000);

            if (mediaRecorder && mediaRecorder.state === "recording") {
                try { mediaRecorder.stop(); } catch (_) {}
            }
            isUserSpeaking = false;

            const nextChunk = audioQueue.shift();
            try {
                const binaryString = atob(nextChunk);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                // Safe Buffer Copy: prevents detachment crashes
                const safeCopy = bytes.buffer.slice(0);
                const audioBuffer = await audioCtx.decodeAudioData(safeCopy);

                activeSourceNode = audioCtx.createBufferSource();
                activeSourceNode.buffer = audioBuffer;
                activeSourceNode.connect(audioCtx.destination);

                activeSourceNode.onended = () => {
                    clearTimeout(mayaSpeakingWatchdog);
                    playNextInQueue();
                };

                activeSourceNode.start(0);
            } catch (decodeErr) {
                console.error("WebAudio Decode Error:", decodeErr);
                clearTimeout(mayaSpeakingWatchdog);
                // Safe step-over: skip corrupt chunk without infinite recursion
                setTimeout(playNextInQueue, 50);
            }
        }

        function interruptPlayback() {
            audioQueue = [];
            isPlayingQueue = false;
            clearTimeout(mayaSpeakingWatchdog);
            if (activeSourceNode) {
                try { activeSourceNode.stop(); } catch (_) {}
                activeSourceNode = null;
            }
            isMayaSpeaking = false;
            orb.className = "quantum-orb";
        }

        function showActionImage(url) {
            actionCard.style.display = "flex";
            cardImage.src = url;
            downloadBtn.href = url;
        }

        function closeActionCard() {
            actionCard.style.display = "none";
            cardImage.src = "";
        }

        function stopLiveCall() {
            userInitiatedStop = true;
            interruptPlayback();
            isCalling = false;
            setConnection("OFFLINE");
            document.getElementById("callToggle").classList.remove("active");
            document.getElementById("callToggle").innerText = "📞";
            setStatus("कॉल समाप्त // बात करने के लिए टैप करें");
            orb.className = "quantum-orb";

            d_mic.innerText = "TRACK: OFF";
            d_vol.innerText = "Vol: 0 (Threshold: 14)";
            d_vad.innerText = "Maya: IDLE | UserRec: false";

            closeActionCard();
            stopHeartbeat();
            if (animFrameId) cancelAnimationFrame(animFrameId);
            clearTimeout(silenceTimer);

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                try { mediaRecorder.stop(); } catch (_) {}
            }
            mediaRecorder = null;
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (ws && ws.readyState === WebSocket.OPEN) ws.close();
            ws = null;
        }
    </script>
</body>
</html>
