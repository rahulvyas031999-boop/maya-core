<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA // SOVEREIGN OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #9d4edd;
            --red: #ff0055;
            --dark: #030612;
            --glass: rgba(6, 12, 28, 0.88);
            --border: rgba(0, 243, 255, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #0a1128 0%, var(--dark) 100%);
            color: #d1e8ff;
            font-family: 'Rajdhani', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }
        header {
            z-index: 20;
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
        }
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--cyan);
        }
        .hud-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .hud-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #mainStage {
            flex: 1;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 8px 0;
        }
        #coreContainer {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ring { position: absolute; border-radius: 50%; pointer-events: none; }
        .ring-1 {
            width: 170px; height: 170px;
            border-top: 2px solid var(--cyan);
            border-bottom: 2px solid var(--purple);
            animation: spinCW 12s linear infinite;
        }
        .ring-2 {
            width: 140px; height: 140px;
            border-left: 2px solid var(--cyan);
            animation: spinCCW 8s linear infinite;
        }
        .quantum-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, var(--cyan) 45%, var(--purple) 85%);
            box-shadow: 0 0 35px var(--cyan), inset 0 0 15px #fff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .quantum-orb.speaking {
            animation: voicePulse 0.9s infinite alternate ease-in-out;
            box-shadow: 0 0 60px var(--cyan), 0 0 90px var(--purple);
        }
        .quantum-orb.listening {
            transform: scale(1.15);
            box-shadow: 0 0 60px #00ffcc;
        }
        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
        @keyframes voicePulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.2); filter: brightness(1.3); }
        }

        #docViewer {
            display: none;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 20, 0.95);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            color: #d1e8ff;
            font-size: 0.9rem;
            line-height: 1.5;
            user-select: text;
            flex-direction: column;
        }

        #actionCard {
            position: absolute;
            z-index: 15;
            width: 90%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #actionCard img {
            width: 100%;
            border-radius: 8px;
            max-height: 180px;
            object-fit: cover;
        }
        .action-btns { display: flex; gap: 8px; width: 100%; }
        .holo-btn {
            flex: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            background: rgba(0, 243, 255, 0.15);
            color: var(--cyan);
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--cyan);
            cursor: pointer;
        }
        .close-btn {
            background: rgba(255, 0, 85, 0.15);
            color: var(--red);
            border-color: var(--red);
        }

        #controls {
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        #statusLabel {
            font-size: 0.88rem;
            color: #d1e8ff;
            font-weight: 600;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-row { display: flex; align-items: center; gap: 16px; }
        .round-btn {
            width: 58px; height: 58px;
            border-radius: 50%;
            border: 2px solid #00ffcc;
            background: radial-gradient(circle at 35% 35%, #00ffcc, #008877);
            color: #030611;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .round-btn.active {
            background: radial-gradient(circle at 35% 35%, #ff3366, var(--red));
            border-color: var(--red);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
        }
        .stop-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid var(--red);
            background: rgba(255, 0, 85, 0.2);
            color: var(--red);
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="hud-title">MAYA <span style="color:var(--cyan); font-size:0.7rem;">INSTANT-LINK v5.0</span></div>
        <div class="hud-badge">
            <div class="hud-dot"></div>
            <span id="pingHud">EDGE // READY</span>
        </div>
    </header>

    <div id="mainStage">
        <div id="coreContainer">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div id="orb" class="quantum-orb"></div>
        </div>

        <div id="docViewer">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="font-family:'Orbitron'; color:var(--cyan); font-size:0.75rem;">📋 LIVE PROJECTION</span>
                <button onclick="closeDocViewer()" style="background:none; border:none; color:var(--red); font-weight:bold; cursor:pointer;">✖ HATAO</button>
            </div>
            <div id="docContent"></div>
        </div>

        <div id="actionCard">
            <img id="cardImage" src="" alt="Projection" />
            <div class="action-btns">
                <a id="downloadBtn" href="" target="_blank" class="holo-btn">⬇️ DOWNLOAD</a>
                <button onclick="closeActionCard()" class="holo-btn close-btn">❌ HATAO</button>
            </div>
        </div>
    </div>

    <div id="controls">
        <div id="statusLabel">कॉल शुरू करने के लिए टैप करें</div>
        <div class="btn-row">
            <button id="callToggle" class="round-btn" onclick="toggleCall()">📞</button>
            <button class="stop-btn" onclick="interruptPlayback()" title="तुरंत रोकें">⏹</button>
        </div>
    </div>

    <script>
        let ws = null;
        let isCalling = false;
        let isMayaSpeaking = false;
        let activeAudio = null;
        let speechRecognizer = null;
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];

        const orb = document.getElementById('orb');
        const coreContainer = document.getElementById('coreContainer');
        const statusLabel = document.getElementById('statusLabel');
        const actionCard = document.getElementById('actionCard');
        const cardImage = document.getElementById('cardImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const docViewer = document.getElementById('docViewer');
        const docContent = document.getElementById('docContent');
        const pingHud = document.getElementById('pingHud');

        async function toggleCall() {
            if (!isCalling) await startLiveCall();
            else stopLiveCall();
        }

        async function startLiveCall() {
            try {
                const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${proto}//${window.location.host}/ws/live`);

                ws.onopen = async () => {
                    isCalling = true;
                    document.getElementById('callToggle').classList.add('active');
                    document.getElementById('callToggle').innerText = '🛑';
                    statusLabel.innerText = "लाइव कॉल कनेक्टेड // बोलिए Boss...";
                    initSpeechInput();
                };

                ws.onmessage = async (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'audio') {
                        playSingleAudio(msg.data);
                    } else if (msg.type === 'transcript') {
                        statusLabel.innerText = `Boss: "${msg.text}"`;
                    } else if (msg.type === 'reply_text') {
                        statusLabel.innerText = `Maya: "${msg.text}"`;
                    } else if (msg.type === 'document') {
                        showDocument(msg.content);
                    } else if (msg.type === 'image') {
                        showActionImage(msg.url);
                    }
                };

                ws.onclose = () => stopLiveCall();
                ws.onerror = () => stopLiveCall();

            } catch (err) {
                alert("Connection Error: " + err);
                stopLiveCall();
            }
        }

        // HACK 1: Browser-Native Speech Recognition (Zero Audio Upload Lag)
        function initSpeechInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (SpeechRecognition) {
                pingHud.innerText = "NATIVE // RECOG";
                speechRecognizer = new SpeechRecognition();
                speechRecognizer.continuous = true;
                speechRecognizer.interimResults = true;
                speechRecognizer.lang = 'hi-IN';

                speechRecognizer.onresult = (event) => {
                    if (isMayaSpeaking) return; // Maya बोल रही हो तो इनपुट छोड़ दो

                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    const liveText = (finalTranscript || interimTranscript).trim();
                    if (liveText) {
                        orb.classList.add('listening');
                        statusLabel.innerText = `Boss: "${liveText}"`;
                    }

                    if (finalTranscript.trim().length > 1) {
                        orb.classList.remove('listening');
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            // सीधा 50-byte टेक्स्ट भेजना, कोई भारी ऑडियो अपलोड नहीं
                            ws.send(JSON.stringify({ type: 'query', text: finalTranscript.trim() }));
                        }
                    }
                };

                speechRecognizer.onerror = (err) => {
                    console.log("Speech Recognition Note:", err.error);
                };

                speechRecognizer.onend = () => {
                    if (isCalling && !isMayaSpeaking) {
                        try { speechRecognizer.start(); } catch(e){}
                    }
                };

                try { speechRecognizer.start(); } catch(e){}
            } else {
                // Fallback: Agar browser me Web Speech API na ho to Audio Blob mode
                pingHud.innerText = "FALLBACK // ASR";
                initAudioRecorderFallback();
            }
        }

        async function initAudioRecorderFallback() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    if (audioChunks.length > 0 && !isMayaSpeaking && ws && ws.readyState === WebSocket.OPEN) {
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        audioChunks = [];
                        if (blob.size > 5000) {
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                ws.send(JSON.stringify({ type: 'audio_blob', data: reader.result.split(',')[1] }));
                            };
                            reader.readAsDataURL(blob);
                        }
                    }
                    if (isCalling && !isMayaSpeaking) {
                        try { mediaRecorder.start(); } catch(e){}
                    }
                };
                mediaRecorder.start();
            } catch(e) {
                statusLabel.innerText = "माइक एक्सेस नहीं मिला";
            }
        }

        // Single Audio Lock & Hardware Pause (Zero Echo)
        function playSingleAudio(b64Audio) {
            interruptPlayback();
            isMayaSpeaking = true;
            orb.className = 'quantum-orb speaking';

            if (speechRecognizer) {
                try { speechRecognizer.stop(); } catch(e){}
            }
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.pause(); } catch(e){}
            }

            activeAudio = new Audio("data:audio/mp3;base64," + b64Audio);

            const resumeListening = () => {
                isMayaSpeaking = false;
                orb.className = 'quantum-orb';
                activeAudio = null;

                if (isCalling) {
                    if (speechRecognizer) {
                        try { speechRecognizer.start(); } catch(e){}
                    }
                    if (mediaRecorder && mediaRecorder.state === 'paused') {
                        try { mediaRecorder.resume(); } catch(e){}
                    }
                }
            };

            activeAudio.onended = resumeListening;
            activeAudio.onerror = resumeListening;
            activeAudio.play().catch(e => {
                console.log("Audio play error:", e);
                resumeListening();
            });
        }

        function interruptPlayback() {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
                activeAudio = null;
            }
            isMayaSpeaking = false;
            orb.className = 'quantum-orb';

            if (isCalling) {
                if (speechRecognizer) {
                    try { speechRecognizer.start(); } catch(e){}
                }
                if (mediaRecorder && mediaRecorder.state === 'paused') {
                    try { mediaRecorder.resume(); } catch(e){}
                }
            }
        }

        function showDocument(content) {
            coreContainer.style.display = 'none';
            docViewer.style.display = 'flex';
            docContent.innerHTML = content.replace(/\n/g, '<br>');
        }

        function closeDocViewer() {
            docViewer.style.display = 'none';
            coreContainer.style.display = 'flex';
        }

        function showActionImage(url) {
            actionCard.style.display = 'flex';
            cardImage.src = url;
            downloadBtn.href = url;
        }

        function closeActionCard() {
            actionCard.style.display = 'none';
            cardImage.src = '';
        }

        function stopLiveCall() {
            interruptPlayback();
            isCalling = false;
            document.getElementById('callToggle').classList.remove('active');
            document.getElementById('callToggle').innerText = '📞';
            statusLabel.innerText = "कॉल समाप्त // पुनः बात करने के लिए टैप करें";
            orb.className = 'quantum-orb';

            closeDocViewer();
            closeActionCard();

            if (speechRecognizer) {
                try { speechRecognizer.stop(); } catch(e){}
                speechRecognizer = null;
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e){}
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (ws && ws.readyState === WebSocket.OPEN) ws.close();
        }
    </script>
</body>
    </html>
