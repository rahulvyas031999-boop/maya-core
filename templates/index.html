<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA // NEURAL OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #9d4edd;
            --red: #ff0055;
            --dark: #030612;
            --glass: rgba(6, 12, 28, 0.85);
            --border: rgba(0, 243, 255, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #0a1128 0%, var(--dark) 100%);
            color: #d1e8ff;
            font-family: 'Rajdhani', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }
        header {
            z-index: 10;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(12px);
        }
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--cyan);
        }
        .hud-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #coreContainer {
            z-index: 10;
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ring { position: absolute; border-radius: 50%; pointer-events: none; }
        .ring-1 {
            width: 230px; height: 230px;
            border-top: 2px solid var(--cyan);
            border-bottom: 2px solid var(--purple);
            animation: spinCW 12s linear infinite;
        }
        .ring-2 {
            width: 190px; height: 190px;
            border-left: 2px solid var(--cyan);
            animation: spinCCW 8s linear infinite;
        }
        .quantum-orb {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, var(--cyan) 45%, var(--purple) 85%);
            box-shadow: 0 0 45px var(--cyan), inset 0 0 20px #fff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .quantum-orb.speaking {
            animation: voicePulse 0.9s infinite alternate ease-in-out;
            box-shadow: 0 0 80px var(--cyan), 0 0 110px var(--purple);
        }
        .quantum-orb.user-active {
            transform: scale(1.15);
            box-shadow: 0 0 80px #00ffcc;
        }
        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
        @keyframes voicePulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.2); filter: brightness(1.3); }
        }

        #actionCard {
            z-index: 15;
            width: 100%;
            max-width: 360px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(14px);
        }
        #actionCard img {
            width: 100%;
            border-radius: 10px;
            max-height: 200px;
            object-fit: cover;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }
        .action-btns { display: flex; gap: 8px; width: 100%; }
        .holo-btn {
            flex: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            background: rgba(0, 243, 255, 0.15);
            color: var(--cyan);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--cyan);
            cursor: pointer;
        }
        .close-btn {
            background: rgba(255, 0, 85, 0.15);
            color: var(--red);
            border-color: var(--red);
        }

        #controls {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 420px;
        }
        #statusLabel {
            font-size: 0.92rem;
            letter-spacing: 0.5px;
            color: #8fa0bc;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #callToggle {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #00ffcc, #008877);
            border: 2px solid #00ffcc;
            color: #030611;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        #callToggle.active {
            background: radial-gradient(circle at 35% 35%, #ff3366, var(--red));
            border-color: var(--red);
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.7);
        }
    </style>
</head>
<body>
    <header>
        <div class="hud-title">MAYA <span style="color:var(--cyan); font-size:0.75rem;">SOVEREIGN v2.6</span></div>
        <div class="hud-badge">
            <div class="hud-dot"></div>
            <span id="pingHud">LINK OK // DESPINA</span>
        </div>
    </header>

    <div id="coreContainer">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div id="orb" class="quantum-orb"></div>
    </div>

    <div id="actionCard">
        <img id="cardImage" src="" alt="Projection" />
        <div class="action-btns">
            <a id="downloadBtn" href="" target="_blank" class="holo-btn">⬇️ DOWNLOAD</a>
            <button onclick="closeActionCard()" class="holo-btn close-btn">❌ HATAO</button>
        </div>
    </div>

    <div id="controls">
        <div id="statusLabel">कॉल शुरू करने के लिए टैप करें</div>
        <button id="callToggle" onclick="toggleCall()">📞</button>
    </div>

    <script>
        let ws = null;
        let audioCtx = null;
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isCalling = false;
        let isMayaSpeaking = false;
        let silenceTimer = null;
        let animFrameId = null;

        const orb = document.getElementById('orb');
        const statusLabel = document.getElementById('statusLabel');
        const actionCard = document.getElementById('actionCard');
        const cardImage = document.getElementById('cardImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const pingHud = document.getElementById('pingHud');

        async function toggleCall() {
            if (!isCalling) {
                await startLiveCall();
            } else {
                stopLiveCall();
            }
        }

        async function startLiveCall() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${proto}//${window.location.host}/ws/live`);

                ws.onopen = async () => {
                    isCalling = true;
                    document.getElementById('callToggle').classList.add('active');
                    document.getElementById('callToggle').innerText = '🛑';
                    statusLabel.innerText = "लाइव कॉल कनेक्टेड // बोलिए Boss...";
                    await startBeepFreeVoiceLink();
                };

                ws.onmessage = async (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'audio') {
                        if (audioCtx.state === 'suspended') await audioCtx.resume();
                        playIncomingPcm(msg.data);
                    } else if (msg.type === 'transcript') {
                        statusLabel.innerText = `Boss: "${msg.text}"`;
                    } else if (msg.type === 'image') {
                        showActionImage(msg.url);
                    } else if (msg.type === 'close_image') {
                        closeActionCard();
                    } else if (msg.type === 'ping') {
                        const pingMs = Math.round((Date.now() - (msg.timestamp * 1000)));
                        pingHud.innerText = `PING: ${Math.max(10, pingMs)}ms`;
                        ws.send(JSON.stringify({ type: 'pong' }));
                    }
                };

                ws.onclose = () => stopLiveCall();
                ws.onerror = () => stopLiveCall();

            } catch (err) {
                alert("Live Link Init Error: " + err);
                stopLiveCall();
            }
        }

        async function startBeepFreeVoiceLink() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                const micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = micAudioCtx.createMediaStreamSource(mediaStream);
                const analyser = micAudioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (audioChunks.length > 0 && !isMayaSpeaking && ws && ws.readyState === WebSocket.OPEN) {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        audioChunks = [];
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64Audio = reader.result.split(',')[1];
                            ws.send(JSON.stringify({
                                type: 'audio_blob',
                                data: base64Audio
                            }));
                        };
                        reader.readAsDataURL(audioBlob);
                    }
                    if (isCalling && !isMayaSpeaking) {
                        try { mediaRecorder.start(); } catch(e){}
                    }
                };

                mediaRecorder.start();

                // Smart VAD Loop (Silent threshold auto-detection)
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                function monitorAudio() {
                    if (!isCalling) return;
                    analyser.getByteFrequencyData(dataArray);

                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    let avg = sum / dataArray.length;

                    // आवाज़ की पहचान होने पर Orb रिएक्ट करेगा
                    if (avg > 14 && !isMayaSpeaking) {
                        orb.classList.add('user-active');
                        clearTimeout(silenceTimer);

                        // 650ms की खामोशी आते ही तुरंत ऑडियो चंक सर्वर पर भेजा जाएगा
                        silenceTimer = setTimeout(() => {
                            orb.classList.remove('user-active');
                            if (mediaRecorder && mediaRecorder.state === 'recording') {
                                mediaRecorder.stop();
                            }
                        }, 650);
                    }

                    animFrameId = requestAnimationFrame(monitorAudio);
                }
                monitorAudio();

            } catch (err) {
                console.error("Mic Access Error:", err);
                statusLabel.innerText = "माइक्रोफ़ोन एक्सेस अस्वीकृत";
            }
        }

        function stopLiveCall() {
            isCalling = false;
            document.getElementById('callToggle').classList.remove('active');
            document.getElementById('callToggle').innerText = '📞';
            statusLabel.innerText = "कॉल समाप्त // पुनः बात करने के लिए टैप करें";
            orb.className = 'quantum-orb';

            if (animFrameId) cancelAnimationFrame(animFrameId);
            clearTimeout(silenceTimer);

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e){}
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
        }

        let audioQueue = [];
        let isPlaying = false;

        function playIncomingPcm(b64Audio) {
            const raw = atob(b64Audio);
            const array = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) array[i] = raw.charCodeAt(i);

            const int16Array = new Int16Array(array.buffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            const buffer = audioCtx.createBuffer(1, float32Array.length, 24000);
            buffer.copyToChannel(float32Array, 0);
            audioQueue.push(buffer);
            if (!isPlaying) playQueue();
        }

        function playQueue() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                isMayaSpeaking = false;
                orb.classList.remove('speaking');
                return;
            }
            isPlaying = true;
            isMayaSpeaking = true;
            orb.classList.add('speaking');
            const buffer = audioQueue.shift();
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.onended = playQueue;
            source.start();
        }

        function showActionImage(url) {
            actionCard.style.display = 'flex';
            cardImage.src = url;
            downloadBtn.href = url;
        }

        function closeActionCard() {
            actionCard.style.display = 'none';
            cardImage.src = '';
        }
    </script>
</body>
</html>
