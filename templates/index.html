<!DOCTYPE html>
<html lang="hi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>MAYA // SOVEREIGN OS</title>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
	<style>
    	:root { --cyan: #00f3ff; --purple: #9d4edd; --red: #ff0055; --dark: #030612; --glass: rgba(6, 12, 28, 0.90); --border: rgba(0, 243, 255, 0.25); }
    	* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    	body { background: radial-gradient(circle at center, #0a1128 0%, var(--dark) 100%); color: #d1e8ff; font-family: 'Rajdhani', sans-serif; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px; overflow: hidden; }
    	header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; margin-top: 105px; }
    	.hud-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.95rem; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px var(--cyan); }
    	.hud-badge { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; padding: 3px 6px; border-radius: 6px; background: rgba(0, 243, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); display: flex; align-items: center; gap: 5px; }
    	.hud-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    	#mainStage { flex: 1; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    	#coreContainer { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
    	.ring { position: absolute; border-radius: 50%; pointer-events: none; }
    	.ring-1 { width: 170px; height: 170px; border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--purple); animation: spinCW 12s linear infinite; }
    	.ring-2 { width: 140px; height: 140px; border-left: 2px solid var(--cyan); animation: spinCCW 8s linear infinite; }
    	.quantum-orb { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffffff, var(--cyan) 45%, var(--purple) 85%); box-shadow: 0 0 35px var(--cyan), inset 0 0 15px #fff; transition: transform 0.15s ease; }
    	.quantum-orb.speaking { animation: voicePulse 0.9s infinite alternate ease-in-out; box-shadow: 0 0 60px var(--cyan), 0 0 90px var(--purple); }
    	.quantum-orb.listening { transform: scale(1.15); box-shadow: 0 0 60px #00ffcc; }
    	@keyframes spinCW { 100% { transform: rotate(360deg); } } @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
    	@keyframes voicePulse { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.2); filter: brightness(1.3); } }
    	#controls { width: 100%; max-width: 480px; background: var(--glass); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        #statusLabel { font-size: 0.88rem; font-weight: 600; text-align: center; width: 100%; min-height: 45px; display: flex; flex-direction: column; justify-content: center; gap: 3px; line-height: 1.2; }
        .boss-text { color: #00ffcc; font-size: 0.85rem; font-style: italic; } .maya-text { color: #d1e8ff; font-size: 0.95rem; }
    	.btn-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
    	.round-btn { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #00ffcc; background: radial-gradient(circle at 35% 35%, #00ffcc, #008877); color: #030611; font-size: 1.8rem; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); display: flex; align-items: center; justify-content: center; }
    	.round-btn.active { background: radial-gradient(circle at 35% 35%, #ff3366, var(--red)); border-color: var(--red); }
    	.stop-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--red); background: rgba(255, 0, 85, 0.2); color: var(--red); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
    	#diagnosticHUD { position: fixed; top: 6px; left: 8px; right: 8px; max-width: 460px; margin: 0 auto; z-index: 9999; background: rgba(3, 6, 18, 0.96); border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); color: #0f0; font-family: monospace; font-size: 11px; padding: 8px 12px; border-radius: 8px; pointer-events: none; }
    	.hud-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 2px 0; }
    	.hud-err { color: #ff0055; font-weight: bold; } .hud-good { color: #00ffcc; font-weight: bold; } .hud-warn { color: #ffd166; font-weight: bold; }
	</style>
</head>
<body>
	<div id="diagnosticHUD">
    	<div class="hud-row"><span>AUDIO</span><span id="d_ws" class="hud-err">DISCONNECTED</span></div>
    	<div class="hud-row"><span>RAW MIC</span><span id="d_mic">OFF</span></div>
    	<div class="hud-row"><span>VAD (30x BOOST)</span><span id="d_vol">0</span></div>
    	<div class="hud-row"><span>DATA BYTES</span><span id="d_delivery">0B</span></div>
	</div>

	<header>
    	<div class="hud-title">MAYA <span style="color:var(--cyan); font-size:0.7rem;">SOVEREIGN OS</span></div>
    	<div class="hud-badge"><div class="hud-dot"></div><span id="connectionState">OFFLINE</span></div>
	</header>

	<div id="mainStage">
    	<div id="coreContainer">
        	<div class="ring ring-1"></div><div class="ring ring-2"></div><div id="orb" class="quantum-orb"></div>
    	</div>
	</div>

	<div id="controls">
    	<div id="statusLabel">कॉल शुरू करने के लिए टैप करें</div>
    	<div class="btn-row">
        	<button id="callToggle" class="round-btn" onclick="toggleCall()">📞</button>
        	<button class="stop-btn" onclick="interruptPlayback()" title="रोकें">⏹</button>
    	</div>
	</div>

	<script>
    	let ws = null, isCalling = false, isMayaSpeaking = false, mediaStream = null, audioCtx = null;
    	let audioProcessor = null, micSource = null, powerBooster = null, outGain = null, dummyOscillator = null, dummyGain = null;
    	let audioChunksPCM = [], packetsSent = 0;
    	let isUserSpeaking = false, silenceTimer = null;
    	let audioQueue = [], isPlayingQueue = false, activeAudio = null;
    	let lastBossText = "";

    	const orb = document.getElementById("orb"), statusLabel = document.getElementById("statusLabel");
    	const d_ws = document.getElementById("d_ws"), d_mic = document.getElementById("d_mic");
    	const d_vol = document.getElementById("d_vol"), d_delivery = document.getElementById("d_delivery");

        function setStatus(text, type = "system") {
            if (type === "boss") {
                lastBossText = text;
                statusLabel.innerHTML = `<span class="boss-text">${text}</span><span class="maya-text" style="opacity:0.5;">माया सोच रही है...</span>`;
            } else if (type === "maya") {
                statusLabel.innerHTML = lastBossText ? `<span class="boss-text">${lastBossText}</span><span class="maya-text">${text}</span>` : `<span class="maya-text">${text}</span>`;
            } else { statusLabel.innerHTML = `<span class="maya-text">${text}</span>`; }
        }

    	async function toggleCall() { if (!isCalling) { await startLiveCall(); } else { stopLiveCall(); } }

    	async function startLiveCall() {
        	try {
            	packetsSent = 0; d_ws.className = "hud-warn"; d_ws.innerText = "CONNECTING...";
            	const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            	ws = new WebSocket(`${protocol}//${window.location.host}/ws/live`);

            	ws.onopen = async () => {
                	isCalling = true; d_ws.className = "hud-good"; d_ws.innerText = "LIVE (200 OK)";
                	document.getElementById("callToggle").classList.add("active"); document.getElementById("callToggle").innerText = "🛑";
                	setStatus("कनेक्टेड। Boss, मैं सुन रही हूँ...", "system");
                	await initHardwareAudio();
            	};

            	ws.onmessage = (event) => {
                	try {
                    	const msg = JSON.parse(event.data);
                    	if (msg.type === "audio_chunk") { enqueueAudioChunk(msg.data); } 
                        else if (msg.type === "transcript") { setStatus(`Boss: "${msg.text}"`, "boss"); } 
                        else if (msg.type === "reply_text") { setStatus(`Maya: "${msg.text}"`, "maya"); }
                        else if (msg.type === "system") { setStatus(msg.text, "system"); }
                	} catch (error) {}
            	};
            	ws.onclose = () => { stopLiveCall(); };
        	} catch (error) { stopLiveCall(); }
    	}

    	async function initHardwareAudio() {
        	try {
                // हैकर फिक्स 1: ब्राउज़र के सभी फिल्टर्स (suppression) बंद कर दिए
            	mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
            	d_mic.className = "hud-good"; d_mic.innerText = `RAW + 30X BOOST`;

            	audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            	if (audioCtx.state === 'suspended') await audioCtx.resume();

                // Dummy oscillator to keep Android audio awake
                dummyOscillator = audioCtx.createOscillator();
                dummyGain = audioCtx.createGain();
                dummyGain.gain.value = 0;
                dummyOscillator.connect(dummyGain);
                dummyGain.connect(audioCtx.destination);
                dummyOscillator.start();

                audioProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
                micSource = audioCtx.createMediaStreamSource(mediaStream);
                
                // 🔥 हैकर फिक्स 2: 30 गुना पावर बूस्टर 🔥
                powerBooster = audioCtx.createGain();
                powerBooster.gain.value = 30.0; // 30 GUNA POWER!

                // पाइपलाइन: Mic -> 30x Booster -> Processor
                micSource.connect(powerBooster);
                powerBooster.connect(audioProcessor);
                
                // Mute processor output so it doesn't echo
                outGain = audioCtx.createGain();
                outGain.gain.value = 0;
                audioProcessor.connect(outGain);
                outGain.connect(audioCtx.destination);

                audioProcessor.onaudioprocess = (e) => {
                    if (!isCalling) return;
                    let inputData = e.inputBuffer.getChannelData(0);
                    
                    let sum = 0;
                    for (let i = 0; i < inputData.length; i++) sum += Math.abs(inputData[i]);
                    let currentVol = Math.round((sum / inputData.length) * 1000); 

                    d_vol.innerText = currentVol;
                    
                    if (currentVol > 15) { d_vol.className = "hud-good"; } 
                    else { d_vol.className = ""; }

                    // अब अगर 30 गुना पावर के बाद भी 15 पार करता है, तो रिकॉर्ड करेगा
                    if (currentVol > 15 && !isMayaSpeaking) {
                        if (!isUserSpeaking) {
                            isUserSpeaking = true; orb.className = "quantum-orb listening";
                            audioChunksPCM = [];
                        }
                        audioChunksPCM.push(new Float32Array(inputData));
                        clearTimeout(silenceTimer);
                    } else if (isUserSpeaking) {
                        audioChunksPCM.push(new Float32Array(inputData));
                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(() => {
                            if (isUserSpeaking) {
                                isUserSpeaking = false; orb.className = "quantum-orb";
                                processAndSendWAV();
                            }
                        }, 800);
                    }
                };
        	} catch (err) { d_mic.className = "hud-err"; d_mic.innerText = `FAIL`; }
    	}

        function processAndSendWAV() {
            if (audioChunksPCM.length === 0 || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            let length = 0;
            for (let i = 0; i < audioChunksPCM.length; i++) length += audioChunksPCM[i].length;
            let flattened = new Float32Array(length);
            let offset = 0;
            for (let i = 0; i < audioChunksPCM.length; i++) {
                flattened.set(audioChunksPCM[i], offset); offset += audioChunksPCM[i].length;
            }
            
            let buffer = new ArrayBuffer(44 + flattened.length * 2);
            let view = new DataView(buffer);
            let sampleRate = audioCtx.sampleRate;
            
            function writeString(view, offset, string) { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); }
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + flattened.length * 2, true);
            writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(view, 36, 'data'); view.setUint32(40, flattened.length * 2, true);
            
            let floatOffset = 44;
            for (let i = 0; i < flattened.length; i++, floatOffset += 2) {
                let s = Math.max(-1, Math.min(1, flattened[i]));
                view.setInt16(floatOffset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            
            let blob = new Blob([view], { type: 'audio/wav' });
            
            if (blob.size < 4000) { d_delivery.className = "hud-warn"; d_delivery.innerText = `REJECTED: ${blob.size}B`; return; }

            const reader = new FileReader();
            reader.onloadend = () => {
                ws.send(JSON.stringify({ type: "audio_blob", mime: "audio/wav", data: reader.result.split(",")[1] }));
                packetsSent++; d_delivery.className = "hud-good"; d_delivery.innerText = `SENT WAV: ${blob.size}B`;
            };
            reader.readAsDataURL(blob);
        }

    	function enqueueAudioChunk(base64Data) { audioQueue.push(base64Data); if (!isPlayingQueue) playNextInQueue(); }
    	function playNextInQueue() {
        	if (!audioQueue.length) { isPlayingQueue = false; isMayaSpeaking = false; orb.className = "quantum-orb"; activeAudio = null; return; }
        	isPlayingQueue = true; isMayaSpeaking = true; orb.className = "quantum-orb speaking";
        	isUserSpeaking = false;
        	activeAudio = new Audio("data:audio/mp3;base64," + audioQueue.shift());
        	activeAudio.onended = () => { playNextInQueue(); };
        	activeAudio.onerror = () => { setTimeout(playNextInQueue, 50); };
        	activeAudio.play().catch(() => { setTimeout(playNextInQueue, 50); });
    	}

    	function interruptPlayback() {
        	audioQueue = []; isPlayingQueue = false;
        	if (activeAudio) { try { activeAudio.pause(); } catch (_) {} activeAudio = null; }
        	isMayaSpeaking = false; orb.className = "quantum-orb";
    	}

    	function stopLiveCall() {
        	interruptPlayback(); isCalling = false;
        	document.getElementById("callToggle").classList.remove("active"); document.getElementById("callToggle").innerText = "📞";
        	setStatus("कॉल समाप्त // बात करने के लिए टैप करें"); orb.className = "quantum-orb";
            
            if (audioProcessor) { audioProcessor.disconnect(); audioProcessor = null; }
            if (powerBooster) { powerBooster.disconnect(); powerBooster = null; }
            if (micSource) { micSource.disconnect(); micSource = null; }
            if (outGain) { outGain.disconnect(); outGain = null; }
            if (dummyOscillator) { try { dummyOscillator.stop(); } catch(e){} }
            if (dummyGain) { dummyGain.disconnect(); dummyGain = null; }
        	if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        	if (ws && ws.readyState === WebSocket.OPEN) ws.close(); ws = null;
    	}
	</script>
</body>
</html>
